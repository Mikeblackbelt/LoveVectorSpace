# iOS build for the Capacitor app in frontend/.
# Always: web build + `cap sync ios` + an unsigned simulator build (proves the project compiles).
# Optional: signed archive + TestFlight upload, only when the signing secrets below are set.
#
# Secrets (Settings → Secrets and variables → Actions):
#   IOS_CERT_P12_BASE64      base64 of the Apple Distribution certificate (.p12)
#   IOS_CERT_PASSWORD        password of that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store provisioning profile for app.lovevectorspace.demo
#   IOS_TEAM_ID              Apple Developer team id
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY   App Store Connect API key (for the upload)
# Variables:
#   VITE_API_BASE            https origin of the deployed backend (native builds cannot use relative /api)
name: ios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_MODE: live
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.ASC_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, build web assets
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: Unsigned simulator build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Install signing certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/lvs.mobileprovision

      - name: Archive and export IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -n 40
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/ipa

      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f $RUNNER_TEMP/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LoveVectorSpace-ios
          path: ${{ runner.temp }}/ipa/*.ipa
