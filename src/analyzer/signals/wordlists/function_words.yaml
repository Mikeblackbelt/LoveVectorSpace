  actually, basically, honestly, totally, pretty, much, well, soon, today, tomorrow,
  tonight, away, back, together, only, simply, absolutely]
negations: ["no", not, never, none, nobody, nothing, nowhere, neither, nor, cannot, n't,
  isn't, aren't, wasn't, weren't, haven't, hasn't, hadn't, don't, doesn't, didn't, won't,
  wouldn't, can't, couldn't, shouldn't, ain't, without]
quantifiers: [all, some, any, many, much, more, most, few, fewer, less, least, several, both,
