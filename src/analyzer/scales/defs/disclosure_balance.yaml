id: disclosure_balance
name: Self-disclosure balance
mode: [potential, established]
item_text: inline
response: {min: 1, max: 7}
items:
  - {id: disclosure_balance_01, text: "I share personal things with my partner that I would not tell most people."}
  - {id: disclosure_balance_02, text: "My partner shares personal things with me that they would not tell most people."}
  - {id: disclosure_balance_03, text: "When I open up, my partner opens up in return."}
  - {id: disclosure_balance_04, text: "When my partner opens up, I open up in return."}
  - {id: disclosure_balance_05, text: "I know what my partner worries about."}
  - {id: disclosure_balance_06, text: "My partner knows what I worry about."}
subscales:
  total: {items: [disclosure_balance_01, disclosure_balance_02, disclosure_balance_03, disclosure_balance_04, disclosure_balance_05, disclosure_balance_06], aggregate: mean}
source:
  citation: "Collins, N. L., & Miller, L. C. (1994). Self-disclosure and liking: a meta-analytic review. Psychological Bulletin, 116, 457-475. Original items motivated by the paper; not a published instrument."
  url: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:7809308&resultType=core&format=json"
verified: false  # original custom items: no published validation
custom: true
owner_approved: false
measures: "Depth of what each person shares about themselves and how evenly it is returned. Responses run from 1 (strongly disagree) to 7 (strongly agree)."
does_not_measure: "Whether the other person likes you, or whether what is shared is truthful."
