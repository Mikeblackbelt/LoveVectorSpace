id: breadcrumbing
name: Intermittent attention check
mode: [potential]
item_text: inline
response: {min: 1, max: 7}
items:
  - {id: breadcrumbing_01, text: "They message me in bursts, then go quiet for days with no explanation."}
  - {id: breadcrumbing_02, text: "Their attention is warm when it happens, but plans rarely follow."}
  - {id: breadcrumbing_03, text: "I often have to start the conversation again after a gap."}
  - {id: breadcrumbing_04, text: "They respond to me enough to keep things going but not enough to make progress."}
  - {id: breadcrumbing_05, text: "We have talked about meeting up, but nothing has been arranged."}
  - {id: breadcrumbing_06, text: "I am unsure where I stand with them."}
subscales:
  total: {items: [breadcrumbing_01, breadcrumbing_02, breadcrumbing_03, breadcrumbing_04, breadcrumbing_05, breadcrumbing_06], aggregate: mean}
source:
  citation: "Navarro, Larranaga, Yubero, & Villora (2020), on psychological correlates of ghosting and breadcrumbing. Original items motivated by the paper; not a published instrument."
  url: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:32050561&resultType=core&format=json"
verified: false  # original custom items: no published validation
custom: true
owner_approved: false
measures: "How much the other person gives small, irregular bursts of attention without the relationship moving forward. Higher means more of this pattern. Responses run from 1 (strongly disagree) to 7 (strongly agree)."
does_not_measure: "The other person's intent, or whether the relationship will progress."
