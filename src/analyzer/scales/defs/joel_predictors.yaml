id: joel_predictors
name: Relationship perception check-in
mode: [established]
item_text: inline
response: {min: 1, max: 7}
items:
  - {id: joel_predictors_01, text: "My partner is committed to our relationship."}
  - {id: joel_predictors_02, text: "My partner appreciates me."}
  - {id: joel_predictors_03, optional: true, text: "I am satisfied with our sexual relationship. (Optional; skip if it does not apply.)"}
  - {id: joel_predictors_04, text: "My partner is satisfied with our relationship."}
  - {id: joel_predictors_05, text: "We have a lot of conflict.", reverse: true}
  - {id: joel_predictors_06, text: "When we disagree, it feels like a problem we are working on together."}
subscales:
  total: {items: [joel_predictors_01, joel_predictors_02, joel_predictors_03, joel_predictors_04, joel_predictors_05, joel_predictors_06], aggregate: mean}
source:
  citation: "Joel, S., et al. (2020). Machine learning uncovers the most robust self-report predictors of relationship quality across 43 longitudinal couples studies. PNAS. Original items motivated by the findings; not a published instrument."
  url: "https://www.pnas.org/doi/10.1073/pnas.1917036117"
verified: false  # original custom items: no published validation
custom: true
owner_approved: false
measures: "Your own current perceptions of the relationship: how committed and appreciative you believe your partner is, how satisfied you think they are, sexual satisfaction (optional) and conflict. Higher is more positive, with conflict reverse-keyed. Responses run from 1 (strongly disagree) to 7 (strongly agree)."
does_not_measure: "Future change in satisfaction (the paper found self-reports do not predict who gets happier or unhappier) or any outcome probability."
