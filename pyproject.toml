[project]
name = "analyzer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "sqlcipher3-wheels>=0.5.7",
    "tokenizers>=0.19",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# plain model download (emotion model only), no torch
fetch = ["huggingface_hub>=0.23"]
# build-time ONNX export of the toxicity model; never installed in the runtime image
export = [
    "huggingface_hub>=0.23",
    "torch>=2.3",
    "optimum[onnxruntime]>=1.21",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/support"]
markers = [
    "models: needs the downloaded ONNX models in models/ (skipped when absent)",
    "slow: long-running benchmark / large-upload tests",
]
